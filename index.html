<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen Garden</title>
<meta name="description" content="Bend light with your hands to wake a garden on your desk. A seated, hands-first mixed reality puzzle for Meta Quest.">
<style>
  :root { --bg: #0d1018; --ink: #f4f1ea; --muted: #a9b3c4; --gold: #ffcc4d; --line: rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at 50% 30%, rgba(13,16,24,.35), rgba(13,16,24,.92) 70%); transition: opacity .35s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card { width: min(520px, 100%); text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #fff6d8 0 18%, #ffcc4d 30%, rgba(255,160,60,.25) 55%, transparent 70%); }
  h1 { font-size: clamp(36px, 7vw, 56px); margin: 0 0 8px; letter-spacing: -.02em; font-weight: 750; }
  .tag { color: var(--muted); font-size: 18px; line-height: 1.5; margin: 0 auto 28px; max-width: 420px; }
  .btns { display: flex; flex-direction: column; gap: 12px; }
  button { font: inherit; font-size: 18px; font-weight: 650; padding: 16px 20px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: var(--ink); cursor: pointer; transition: background .15s, transform .1s; }
  button:hover { background: rgba(255,255,255,.12); }
  button:active { transform: scale(.98); }
  button.primary { background: var(--gold); color: #2a1d00; border-color: transparent; }
  button.primary:hover { background: #ffe08a; }
  button[hidden] { display: none; }
  .note { color: var(--muted); font-size: 14px; margin-top: 18px; line-height: 1.5; }
  .feat { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 22px; color: var(--muted); font-size: 13px; }
  #menu { position: fixed; top: 16px; left: 16px; padding: 10px 14px; font-size: 14px; display: none; backdrop-filter: blur(6px); }
  #err { color: #ff9a8a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>Lumen Garden</h1>
    <p class="tag">Bend light with your hands to wake a garden on your desk.</p>
    <div class="btns">
      <button id="btn-ar" class="primary" hidden>Play in mixed reality</button>
      <button id="btn-vr" hidden>Play in VR</button>
      <button id="btn-flat">Play on this screen</button>
    </div>
    <p class="note" id="note">Checking for a headset…</p>
    <div class="feat"><span>Hands only</span><span>Seated</span><span>2-minute puzzles</span><span>New garden daily</span></div>
  </div>
</div>
<button id="menu">Menu</button>

<script>/* puzzle.js */
/* Lumen Garden — puzzle engine (no dependencies).
 * Grid: x = column (0..w-1, left→right), y = row (0..h-1, far→near the player).
 * Cell types: '.' empty, '#' stone, emitter ('>' '<' '^' 'v'),
 *             '/' or '\\' mirror (rotatable), 'x' crystal (splits beam left+right),
 *             '*' seed (light passes through; blooms when lit).
 */
(function (root) {
  'use strict';

  var DIRS = { '>': [1, 0], '<': [-1, 0], '^': [0, -1], 'v': [0, 1] };

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashString(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /** Parse an array of row strings into a level object. */
  function parse(rows, meta) {
    var h = rows.length, w = rows[0].length;
    var cells = [], mirrors = [], seeds = [], emitters = [];
    for (var y = 0; y < h; y++) {
      if (rows[y].length !== w) throw new Error('Ragged row ' + y);
      for (var x = 0; x < w; x++) {
        var c = rows[y][x], cell = { x: x, y: y, t: '.' };
        if (c === '#') cell.t = '#';
        else if (DIRS[c]) { cell.t = 'E'; cell.dir = DIRS[c].slice(); emitters.push(cell); }
        else if (c === '/' || c === '\\') { cell.t = 'M'; cell.o = c === '/' ? 0 : 1; cell.mi = mirrors.length; mirrors.push(cell); }
        else if (c === 'x') cell.t = 'X';
        else if (c === '*') { cell.t = 'S'; cell.si = seeds.length; seeds.push(cell); }
        else if (c !== '.') throw new Error('Unknown cell char ' + c);
        cells.push(cell);
      }
    }
    var lv = { w: w, h: h, cells: cells, mirrors: mirrors, seeds: seeds, emitters: emitters };
    if (meta) for (var k in meta) lv[k] = meta[k];
    return lv;
  }

  function toRows(lv) {
    var rows = [];
    for (var y = 0; y < lv.h; y++) {
      var r = '';
      for (var x = 0; x < lv.w; x++) {
        var c = lv.cells[y * lv.w + x];
        if (c.t === '#') r += '#';
        else if (c.t === 'E') r += c.dir[0] === 1 ? '>' : c.dir[0] === -1 ? '<' : c.dir[1] === -1 ? '^' : 'v';
        else if (c.t === 'M') r += c.o === 0 ? '/' : '\\';
        else if (c.t === 'X') r += 'x';
        else if (c.t === 'S') r += '*';
        else r += '.';
      }
      rows.push(r);
    }
    return rows;
  }

  function reflect(o, dx, dy) {
    // '/' : (dx,dy) -> (-dy,-dx)   '\' : (dx,dy) -> (dy,dx)
    return o === 0 ? [-dy, -dx] : [dy, dx];
  }

  /**
   * Trace all beams. orients: optional array overriding mirror orientations.
   * Returns { segs: [[x0,y0,x1,y1],...] in cell units (cell centres at integers),
   *           lit: bool per seed, litCells: Map key->bounces, mirrorsHit: Set of mirror idx }
   */
  function simulate(lv, orients) {
    var w = lv.w, h = lv.h, cells = lv.cells;
    var segs = [], lit = lv.seeds.map(function () { return false; });
    var litCells = {}, mirrorsHit = {}, seen = {};
    var stack = [];
    lv.emitters.forEach(function (e) { stack.push([e.x, e.y, e.dir[0], e.dir[1], 0]); });
    var guard = 0;
    while (stack.length && guard++ < 4000) {
      var b = stack.pop(), x = b[0], y = b[1], dx = b[2], dy = b[3], bounces = b[4];
      while (guard++ < 4000) {
        var nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) { segs.push([x, y, x + dx * 0.5, y + dy * 0.5]); break; }
        var c = cells[ny * w + nx];
        if (c.t === '#' || c.t === 'E') { segs.push([x, y, x + dx * 0.5, y + dy * 0.5]); break; }
        segs.push([x, y, nx, ny]);
        var key = nx + ',' + ny + ',' + dx + ',' + dy;
        if (seen[key]) break;
        seen[key] = true;
        x = nx; y = ny;
        var ck = x + ',' + y;
        litCells[ck] = Math.max(litCells[ck] || 0, bounces);
        if (c.t === 'S') lit[c.si] = true;
        else if (c.t === 'M') {
          var o = orients ? orients[c.mi] : c.o;
          if (o === -1) return { pending: c.mi };
          var r = reflect(o, dx, dy); dx = r[0]; dy = r[1]; bounces++;
          mirrorsHit[c.mi] = true;
        } else if (c.t === 'X') {
          // split into the two perpendicular directions
          stack.push([x, y, dy, dx, bounces + 1]);
          stack.push([x, y, -dy, -dx, bounces + 1]);
          break;
        }
      }
    }
    return { segs: segs, lit: lit, litCells: litCells, mirrorsHit: mirrorsHit,
             solved: lit.length > 0 && lit.every(Boolean) };
  }

  function currentOrients(lv) { return lv.mirrors.map(function (m) { return m.o; }); }

  /** All solutions as partial assignments (-1 = mirror never touched, any orientation works).
   *  Lazy branching: only mirrors the light actually reaches are decided. */
  function solutions(lv, cap) {
    var out = [], calls = 0;
    function go(assign) {
      if (cap && out.length >= cap) return;
      if (++calls > 20000) return;
      var r = simulate(lv, assign);
      if (r.pending !== undefined) {
        var a0 = assign.slice(), a1 = assign.slice();
        a0[r.pending] = 0; a1[r.pending] = 1;
        go(a0); go(a1);
      } else if (r.solved) out.push(assign);
    }
    go(lv.mirrors.map(function () { return -1; }));
    return out;
  }

  /** Minimum flips from the current state to any solution, and that solution (fully specified). */
  function nearestSolution(lv, orients) {
    orients = orients || currentOrients(lv);
    var sols = solutions(lv), best = null, bestD = Infinity;
    sols.forEach(function (s) {
      var d = 0;
      for (var i = 0; i < s.length; i++) if (s[i] !== -1 && s[i] !== orients[i]) d++;
      if (d < bestD) { bestD = d; best = s; }
    });
    if (!best) return null;
    var full = best.map(function (v, i) { return v === -1 ? orients[i] : v; });
    return { flips: bestD, solution: full, count: sols.length };
  }

  /** Index of a mirror the player should flip next (for hints), or -1. */
  function hint(lv) {
    var o = currentOrients(lv), near = nearestSolution(lv, o);
    if (!near || near.flips === 0) return -1;
    // Prefer a wrong mirror the beam currently touches, so the hint is visible.
    var hit = simulate(lv).mirrorsHit, fallback = -1;
    for (var i = 0; i < o.length; i++) {
      if (o[i] !== near.solution[i]) {
        if (hit[i]) return i;
        if (fallback < 0) fallback = i;
      }
    }
    return fallback;
  }

  /* ---------------- Handcrafted onboarding levels ---------------- */
  var LEVELS = [
    { name: 'First Light', tip: 'Tap the mirror to turn it.', rows: [
      '>../',
      '....',
      '...*'] },
    { name: 'Two Turns', tip: 'Light bends at every mirror.', rows: [
      '>..../',
      '......',
      '......',
      '.*...\\'] },
    { name: 'Stones', tip: 'Stones block the light. Wake both seeds.', rows: [
      'v.....',
      '...#..',
      '/..../',
      '..#...',
      '*....*',
      '/....\\'] },
    { name: 'Crystal', tip: 'Crystals split light in two.', rows: [
      '......',
      '*../..',
      '......',
      '>..x..',
      '......',
      '.\\./.*'] },
    { name: 'Garden Path', tip: 'Every seed must glow at once.', rows: [
      '>.../.',
      '.#....',
      '\\.*./.',
      '...*..',
      '.....#',
      '\\*.\\..'] }
  ];

  function level(i) { var L = LEVELS[i]; return parse(L.rows, { name: L.name, tip: L.tip, index: i }); }

  /* ---------------- Procedural generator (daily / endless) ---------------- */
  function generate(seed, opts) {
    opts = opts || {};
    var size = opts.size || 6, minFlips = opts.minFlips || 3, crystal = opts.crystal !== false;
    var rnd = mulberry32(seed);
    function ri(n) { return Math.floor(rnd() * n); }
    for (var attempt = 0; attempt < 400; attempt++) {
      var g = [];
      for (var y = 0; y < size; y++) { g.push([]); for (var x = 0; x < size; x++) g[y].push('.'); }
      // emitter on an edge, pointing inward

      if (rp) { var m = rp.transform.matrix; p.o = [m[12], m[13], m[14]]; p.d = M.norm([-m[8], -m[9], -m[10]]); }
      if (src.hand && frame.getJointPose) {
        var tipSpace = src.hand.get('index-finger-tip'), tp = tipSpace && frame.getJointPose(tipSpace, xr.ref);
        if (tp) p.tip = [tp.transform.position.x, tp.transform.position.y, tp.transform.position.z];
        if (xr.mode !== 'immersive-ar') {
          p.joints = [];
          src.hand.forEach(function (space) {
            var jp = frame.getJointPose(space, xr.ref);
            if (jp) p.joints.push([jp.transform.position.x, jp.transform.position.y, jp.transform.position.z, jp.radius || 0.005]);
          });
        }
      } else if (src.gripSpace && !src.hand) {
        var gp = frame.getPose(src.gripSpace, xr.ref);
        if (gp) { var g = gp.transform.position; p.joints = [[g.x, g.y, g.z, 0.012]]; }
      }

      gl.viewport(vp.x, vp.y, vp.width, vp.height);

    });
  };

  root.Game = Game;
})(this);

</script>
<script>
(function () {
  var overlay = document.getElementById('overlay'), note = document.getElementById('note'), menu = document.getElementById('menu');
  var game;
  try { game = window.game = new Game(document.getElementById('c')); }
  catch (e) { note.innerHTML = '<span id="err">This browser can’t run WebGL: ' + e.message + '</span>'; return; }
  function hide() { overlay.classList.add('hidden'); }
  function show() { overlay.classList.remove('hidden'); menu.style.display = 'none'; }
  game.onExit = show;
  document.getElementById('btn-flat').onclick = function () { game.sound.unlock(); hide(); menu.style.display = 'block'; };
  menu.onclick = show;
  function wire(id, mode) {
    var b = document.getElementById(id);
    b.hidden = false;
    b.onclick = function () {
      game.enterXR(mode).then(hide).catch(function (e) { note.innerHTML = '<span id="err">Couldn’t start: ' + e.message + '</span>'; });
    };
  }
  if (!navigator.xr) { note.textContent = 'Open this page in the Meta Quest Browser to play with your hands in mixed reality.'; return; }
  Promise.all([navigator.xr.isSessionSupported('immersive-ar').catch(function () { return false; }),
               navigator.xr.isSessionSupported('immersive-vr').catch(function () { return false; })]).then(function (r) {
    if (r[0]) wire('btn-ar', 'immersive-ar');
    if (r[1]) wire('btn-vr', 'immersive-vr');
    if (!r[1] && document.getElementById('btn-flat')) document.getElementById('btn-flat').classList.add('primary');
    note.textContent = r[0] || r[1] ? 'Sit comfortably. The garden appears just in front of you, within reach.'
      : 'Open this page in the Meta Quest Browser to play with your hands in mixed reality.';
  });
})();
</script>
